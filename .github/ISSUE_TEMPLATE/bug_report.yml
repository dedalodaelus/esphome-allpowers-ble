name: Bug report
description: Report a reproducible defect in an already supported configuration
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Remove Wi-Fi passwords, API keys, OTA passwords, complete BLE addresses and unrelated BLE data before submitting.
        Use the separate Compatibility report form when evaluating a new model or firmware family.
  - type: input
    id: component_revision
    attributes:
      label: Component release, tag or commit
      placeholder: "v0.2.1 or e61b943"
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Exact model and hardware revision
      placeholder: "R600, label revision, serial prefix if relevant"
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Power-station firmware version
      placeholder: "Version shown by the official app"
    validations:
      required: true
  - type: input
    id: esphome_version
    attributes:
      label: ESPHome version
      placeholder: "2026.7.0"
    validations:
      required: true
  - type: input
    id: board
    attributes:
      label: ESP32 board and framework
      placeholder: "ESP32-S3 DevKitC-1, ESP-IDF"
    validations:
      required: true
  - type: dropdown
    id: regression
    attributes:
      label: Did this work in an earlier component revision?
      options:
        - "No"
        - "Yes"
        - "Unknown"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction steps
      description: Include the smallest relevant YAML fragment and physical preconditions.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized ESPHome logs
      render: shell
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, complete addresses and unrelated BLE traffic.
          required: true
