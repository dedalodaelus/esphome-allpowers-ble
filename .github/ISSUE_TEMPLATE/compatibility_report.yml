name: Compatibility report
description: Submit protocol evidence for a new ALLPOWERS model or firmware revision
title: "[Compatibility]: "
labels: [compatibility]
body:
  - type: markdown
    attributes:
      value: |
        A successful BLE connection alone does not prove compatibility. Remove credentials, complete addresses, serial numbers and unrelated BLE traffic before submitting.
  - type: input
    id: model
    attributes:
      label: Exact model and hardware revision
      placeholder: "Full model name and label/board revision"
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Power-station firmware version
      placeholder: "Version shown by the official app"
    validations:
      required: true
  - type: input
    id: ble_name
    attributes:
      label: BLE local name and address stability
      placeholder: "Advertised local name; state whether the address is stable or rotates"
    validations:
      required: true
  - type: input
    id: component_revision
    attributes:
      label: Component release, tag or commit
      placeholder: "v0.2.1 or commit SHA"
    validations:
      required: true
  - type: input
    id: esphome_version
    attributes:
      label: ESPHome version
      placeholder: "2026.7.0"
    validations:
      required: true
  - type: input
    id: board
    attributes:
      label: ESP32 board and framework
      placeholder: "ESP32-S3 DevKitC-1, ESP-IDF"
    validations:
      required: true
  - type: input
    id: service_uuid
    attributes:
      label: GATT service UUID
      placeholder: "FFF0 or full 128-bit UUID"
    validations:
      required: true
  - type: input
    id: notify_uuid
    attributes:
      label: Notification characteristic UUID and properties
      placeholder: "FFF1; notify and/or indicate"
    validations:
      required: true
  - type: input
    id: write_uuid
    attributes:
      label: Write characteristic UUID and properties
      placeholder: "FFF2; write and/or write without response"
    validations:
      required: true
  - type: textarea
    id: notification_frame
    attributes:
      label: Complete sanitized status notification frame
      description: Include every byte of at least one frame and the conditions under which it was captured.
      render: shell
    validations:
      required: true
  - type: textarea
    id: capture_conditions
    attributes:
      label: Capture conditions
      placeholder: "SOC, connected loads/chargers, outputs enabled, elapsed time and official app action"
    validations:
      required: true
  - type: textarea
    id: simultaneous_values
    attributes:
      label: Simultaneous official and decoded values
      description: Record the station display or official app values next to ESPHome battery, input, output and remaining-time values.
    validations:
      required: true
  - type: textarea
    id: controls_tested
    attributes:
      label: Controls physically tested
      description: List each AC, DC, light, ECO, work-mode or Car Charger action tested, including initial and final physical state. Write "telemetry only" when no control was tested.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized ESPHome logs
      render: shell
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy and evidence confirmation
      options:
        - label: I removed credentials, complete addresses, serial numbers and unrelated BLE traffic.
          required: true
        - label: I understand that connection alone is insufficient and supplied protocol/value evidence.
          required: true
